name: Linux amd64 release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag, for example v0.1.0-rc.1'
        required: true
        type: string
permissions:
  contents: read
  packages: write
concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false
jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Select version
        id: version
        env: { VERSION: "${{ inputs.version }}", REPOSITORY: "${{ github.repository }}" }
        run: |
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$ ]]; then exit 1; fi
          printf 'image=ghcr.io/%s:%s\n' "${REPOSITORY,,}" "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build and publish versioned image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.actor }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$USERNAME" --password-stdin
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" -f deploy/Dockerfile -t "$IMAGE" .
          docker push "$IMAGE"
          docker pull --platform linux/amd64 postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
      - name: Offline archive and dependency manifests
        env: { IMAGE: "${{ steps.version.outputs.image }}", VERSION: "${{ inputs.version }}" }
        run: python3 deploy/release.py --image "$IMAGE" --version "$VERSION" --output "openform-$VERSION-linux-amd64.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: openform-${{ inputs.version }}-linux-amd64
          path: |
            openform-*-linux-amd64.tar
            openform-*-linux-amd64.tar.sha256
          compression-level: 0
          retention-days: 30
