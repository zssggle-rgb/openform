function diagnosisPage(){return `<div class="page-head"><div><h1>Unit 3 · 校园生活词汇闯关</h1><p>七年级（2）班 · 林老师 · 发布版本 v1.2 · 10月4日第2节</p></div><div class="head-actions"><button class="btn" data-action="entry">学生入口</button><button class="btn" data-action="export">${icon('download')}导出记录</button></div></div><div class="panel intro-line"><span class="tag green dot">接收中</span><span>当前课堂持续接收提交</span><span class="end muted small">本报告固定到 10:42，后续提交不改变已有结论</span></div><div class="panel metrics"><div class="metric">已进入 <strong>38<span class="suffix"> / 40 人</span></strong></div><div class="metric">已完成 <strong>34<span class="suffix"> / 40 人</span></strong></div><div class="metric">完成率 <strong>85<span class="suffix"> %</span></strong></div><div class="metric">尚未完成 <strong>6<span class="suffix"> 人</span></strong></div></div><div class="panel" style="margin-bottom:16px"><div class="tabs"><button data-report="overview" class="${reportTab==='overview'?'active':''}">课堂概览</button><button data-report="records" class="${reportTab==='records'?'active':''}">提交记录</button><span class="scope">${icon('clock')}统计截止 10:42</span></div></div>${reportTab==='records'?recordsPanel():`<div class="split"><section class="panel"><div class="section-head"><div><h2>题目表现</h2><p>每人最近一次有效完成提交 · 34 人</p></div><span class="tag">规则统计</span></div><div class="section-body">${[{name:'01 · 词义辨析',sub:'library',right:30,pct:88},{name:'02 · 易混词辨析',sub:'library / laboratory',right:20,pct:59},{name:'03 · 情境选词',sub:'school life',right:28,pct:82},{name:'04 · 句子补全',sub:'in the playground',right:23,pct:68}].map(q=>`<div class="performance-row"><div class="question-label">${q.name}<small>${q.sub}</small></div><div><div class="bar-track"><div class="bar" style="width:${q.pct}%"></div></div><div class="subline">${q.right} / 34 人答对 · 未答 0 人</div></div><strong class="num">${q.pct}%</strong></div>`).join('')}<div class="insight-action"><strong>第 2 题值得再讲一次</strong><br>14 位学生尚未答对，可结合他们的作答重新解释易混词。</div></div></section><section class="panel"><div class="section-head"><div><h2>教学归纳与建议</h2><p>教师复核后用于后续教学</p></div><span class="tag ${reviewed?'green':'orange'}">${reviewed?'已复核':'待复核'}</span></div><div class="analysis-note">归纳覆盖 30 / 34 份完成提交，4 份暂未纳入。未完成学生未被计入模型归纳。</div><div class="finding"><div class="finding-head"><h3>易混词主要集中在两个场所词</h3><span class="tag purple">12 人</span></div><p>在已分析记录中，学生将 library 与 laboratory 的含义混淆。建议用“借书”和“做实验”两个具体场景对照讲解。</p><button class="link" data-action="evidence">查看作答依据 ${icon('external')}</button></div><div class="finding"><h3>下一步可以这样安排</h3><p>先给出两个校园场景，让学生解释选择理由；再用一道新题检查是否分清两个词。</p><div class="review-bar"><span class="small muted">不会自动发布新活动</span><button class="btn primary" data-action="review">${reviewed?'查看复核记录':'标记已复核'}</button></div></div></section></div><p class="report-meta">尚未完成的 6 人中，4 人已进入但未完成，2 人未进入。完成率以班级名单 40 人为分母。<br>题目正确率以该题有效作答人数为分母；统计由规则计算，归纳建议由模型辅助形成。</p>`}`;}
function recordsPanel(){return `<section class="panel"><div class="section-head"><h2>提交记录示例</h2><span class="small muted">展示 4 条合成样例</span></div><div class="table-wrap"><table><thead><tr><th>学生</th><th>状态</th><th>最近有效提交</th><th>尝试次数</th><th>操作</th></tr></thead><tbody>${[['学生 01','已完成','10:36','1'],['学生 02','已完成','10:38','2'],['学生 03','进行中','—','0'],['学生 04','未进入','—','0']].map(r=>`<tr><td>${r[0]}</td><td><span class="tag ${r[1]==='已完成'?'green':''}">${r[1]}</span></td><td>${r[2]}</td><td>${r[3]}</td><td>${r[1]==='已完成'?'<button class="link" data-action="evidence">查看作答</button>':'<span class="muted small">尚无完成提交</span>'}</td></tr>`).join('')}</tbody></table></div></section>`;}
function libraryPage(){return `<div class="page-head"><div><h1>校内资源库</h1><p>把一次好用的教学活动，带到更多课堂。</p></div><button class="btn primary" data-action="publish">${icon('plus')}发布我的活动</button></div><div class="panel intro-line">${icon('copy')}<span>复制后成为自己的独立活动，保留来源，不包含学生记录和班级名单。</span></div><section class="panel"><div class="filters"><div class="search">${icon('search')}<input id="resource-search" type="search" aria-label="搜索校内资源" placeholder="搜索活动、教学主题"></div><select id="resource-subject" aria-label="筛选学科"><option value="all">全部学科</option><option>英语</option><option>生物</option><option>物理</option></select><span class="results" id="resource-count"></span></div><div id="resource-results"></div></section><p class="footnote">${icon('shield')}本校活跃教师可发现与复制资源；查看源活动或学生回答需要另外授权。</p>`;}
function updateResources(){const q=($('#resource-search')?.value||'').trim();const s=$('#resource-subject')?.value||'all';const rows=resources.filter(r=>(r.name+r.description).includes(q)&&(s==='all'||r.subject===s));$('#resource-count').textContent=`共 ${rows.length} 个资源`;$('#resource-results').innerHTML=rows.length?`<div class="table-wrap"><table class="resource-table"><thead><tr><th style="width:50%">活动与教学内容</th><th>发布者</th><th>已验证版本</th><th>更新日期</th><th>操作</th></tr></thead><tbody>${rows.map(r=>`<tr><td><div class="resource-title">${r.name}</div><div class="subline">${r.description}</div><div class="resource-tags"><span class="tag">${r.subject}</span><span class="tag">${r.grade}</span><span class="tag">${r.type}</span></div></td><td>${r.author}</td><td><span class="tag green">${r.version}</span></td><td class="muted nowrap">${r.date}</td><td><div class="row-actions"><button class="link" data-action="resource-preview" data-name="${r.name}">预览</button><button class="link" data-action="copy-resource" data-name="${r.name}">复制使用</button></div></td></tr>`).join('')}</tbody></table></div><div class="table-foot"><span>共 ${rows.length} 个校内资源</span><span>青禾实验学校</span><span class="page-number">1</span></div>`:`<div class="empty"><div><h2>没有匹配的校内资源</h2><p>换一个主题或学科再试试。</p><button class="btn" data-action="reset-resource">清空筛选</button></div></div>`;}
function membersPage(){return `<div class="page-head"><div><h1>成员与权限</h1><p>青禾实验学校 · 管理成员、角色与任教范围</p></div><button class="btn primary" data-action="invite">${icon('plus')}邀请教师</button></div><div class="callout">${icon('shield')}<span>学校管理权限用于成员和资源管理。查看课堂回答，还需要对应的教学授权。</span></div><section class="panel"><div class="section-head"><h2>学校成员 <span class="muted small">5 人</span></h2><span class="small muted">学校管理员视角预览</span></div><div class="table-wrap"><table><thead><tr><th>成员</th><th>学校角色</th><th>任教范围</th><th>状态</th><th>操作</th></tr></thead><tbody>${[{name:'林老师',role:'教师',scope:'七年级（2）班 · 英语',status:'正常'},{name:'陈老师',role:'教师',scope:'七年级（1、2）班 · 生物',status:'正常'},{name:'周老师',role:'教师 / 资源管理员',scope:'八年级（1）班 · 物理',status:'正常'},{name:'许老师',role:'学校管理员',scope:'未分配教学授权',status:'正常'},{name:'陆老师',role:'教师',scope:'待分配任教范围',status:'待加入'}].map(m=>`<tr><td><div class="person"><span class="avatar">${m.name[0]}</span>${m.name}</div></td><td>${m.role}</td><td class="muted">${m.scope}</td><td><span class="tag ${m.status==='正常'?'green':'orange'} dot">${m.status}</span></td><td><button class="link" data-action="member" data-name="${m.name}">查看权限</button></td></tr>`).join('')}</tbody></table></div><div class="table-foot"><span>5 位成员 · 4 位已加入</span><span>成员离校后，可按授权交接学校资源</span><span class="page-number">1</span></div></section><p class="footnote">${icon('info')}成员角色与任教范围分别管理。成员停用后撤销访问，学校资源可按授权交接。</p>`;}
function studentPage(){const q=questions[questionIndex];const answered=Object.keys(answers).length;return `<header class="student-top"><a class="brand" href="#activities"><img class="brand-lockup" src="assets/brand/svg/openform-logo-primary.svg" alt="OpenForm"><img class="brand-symbol" src="assets/brand/svg/openform-mark-primary.svg" alt="OpenForm"></a><span class="small">青禾实验学校 · 林老师</span></header><div class="student-main"><div class="student-heading"><h1>校园生活词汇闯关</h1><p class="muted small">Unit 3 · School life <span style="margin:0 8px">/</span> 临时参与 · 当前浏览器</p></div>${pageState==='offline'?`<div class="callout orange">${icon('wifi')}<span>网络已断开。答案暂存在当前页面，尚未送达。请保持页面打开，联网后重试。</span></div>`:''}<section class="student-card">${submitted?`<div class="receipt"><div class="receipt-icon">${icon('check')}</div><h2>已提交 · 演示回执</h2><p>已完成本次词汇练习。</p><div class="receipt-summary"><div>已完成题目<strong>3 / 3</strong></div><div>本次尝试<strong>1</strong></div></div><p class="small">此处演示提交后的界面，不代表真实数据已保存。</p><button class="btn" style="margin-top:20px;min-height:44px" data-action="restart-student">重新体验</button></div>`:`<div class="student-progress"><span>第 ${questionIndex+1} 题 / 共 3 题</span><span>已作答 ${answered} 题</span></div><div class="progress-track" aria-label="已作答 ${answered} / 3 题"><div class="progress-fill" style="width:${answered/3*100}%"></div></div><h2 class="student-question">${q.word}</h2><p class="student-prompt">${q.prompt}</p><div aria-label="选择答案">${q.options.map((a,i)=>`<button class="choice ${answers[questionIndex]===i?'selected':''}" data-answer="${i}" aria-pressed="${answers[questionIndex]===i}"><span class="letter">${'ABC'[i]}</span>${a}${answers[questionIndex]===i?`<span style="margin-left:auto;color:var(--strong)">${icon('check')}</span>`:''}</button>`).join('')}</div><div class="student-actions"><button class="btn" data-action="previous-question" ${questionIndex===0?'disabled':''}>上一题</button><button class="btn primary" data-action="next-question" ${answers[questionIndex]===undefined||pageState==='offline'?'disabled':''}>${questionIndex===2?'提交本次练习':'下一题'}</button></div>`}</section><p class="save-status">${icon(pageState==='offline'?'wifi':'info')}${submitted?'演示流程已完成':pageState==='offline'?'尚未确认保存，请勿关闭页面':'预览模式：答案仅保留在当前页面'}</p><p class="student-help">正式活动会在收到保存确认后显示“已保存”。临时参与只支持当前浏览器继续；跨设备使用需要教师提供个人进入码。</p></div>`;}
function systemPage(){return `<div class="page-head"><div><h1>同一套风格，不同的课堂任务</h1><p>继承 AdPilot 的浅色工作台 · 教师与校园端紧凑，学生端易读易点</p></div><button class="btn" data-page="activities">查看页面应用</button></div><section class="panel"><div class="section-head"><h2>颜色与角色</h2><span class="small muted">主按钮使用较深紫色，保证白字可读</span></div><div class="section-body palette">${[['主色','#6C5CE7'],['主按钮','#5B4BCB'],['选中底色','#F0EEFF'],['正文','#161823'],['工作区','#F5F5F5']].map(([n,c])=>`<div><div class="swatch" style="background:${c}"></div><strong>${n}</strong><div class="mono small muted">${c}</div></div>`).join('')}</div></section><div class="guide-grid"><section class="panel"><div class="section-head"><h2>字体与密度</h2></div><div class="section-body"><div class="type-sample"><h1>我的活动</h1><span class="small muted">页面标题 · 20px</span></div><div class="type-sample"><span>查看课堂结果，找到下一步教学重点。</span><span class="small muted">正文 · 14px</span></div><div class="type-sample"><span class="student-question">选择正确的词义</span><span class="small muted">学生题干 · 22px</span></div><div class="type-sample"><strong class="mono">34 / 40</strong><span class="small muted">等宽数字</span></div></div></section><section class="panel"><div class="section-head"><h2>操作与反馈</h2></div><div class="section-body"><div class="component-row"><button class="btn primary" data-action="create">新建活动</button><button class="btn" data-action="sample-dialog">次要操作</button><button class="btn" disabled>暂不可用</button><button class="link" data-action="sample-dialog">查看详情</button></div><div class="component-row"><span class="tag green dot">已保存</span><span class="tag orange dot">待确认</span><span class="tag red dot">提交失败</span><span class="tag purple">当前选中</span></div><label class="field" for="example-input"><span>活动名称</span><input id="example-input" aria-invalid="true" aria-describedby="name-error" placeholder="例如：校园生活词汇闯关"><span class="inline-error" id="name-error">错误状态示例：请填写活动名称。</span></label></div></section></div><div class="guide-grid"><section class="panel"><div class="section-head"><h2>教师与校园端</h2></div><div class="section-body"><ul class="guide-list"><li>60px 顶栏，240px 侧栏</li><li>32px 按钮，42px 表头，按内容调整行高</li><li>先展示活动、数据与操作，再展示说明</li><li>无大横幅、渐变和重复套卡片</li></ul></div></section><section class="panel"><div class="section-head"><h2>学生端</h2></div><div class="section-body"><ul class="guide-list"><li>单列答题，保留相同紫色和字体</li><li>16px 正文，56px 选项，48px 操作按钮</li><li>作答进度与保存状态分别显示</li><li>断网、未收到回执不显示已提交</li></ul><button class="link" data-page="student">打开学生答题页 →</button></div></section></div>`;}
function statePage(){const data={empty:['grid','还没有活动','可以描述教学想法，从第一个课堂活动开始。','新建活动','create'],error:['info','活动暂时加载失败','已有活动没有被删除，请稍后重试。','重新加载','retry'],permission:['shield','你没有这个课堂的查看权限','可以返回自己的活动，或联系任课教师申请授权。','返回我的活动','back']};const [i,title,copy,label,action]=data[pageState];return `<div class="page-head"><div><h1>${page==='library'?'校内资源':page==='members'?'校园管理':'教学工作台'}</h1><p>状态样式示例</p></div></div><div class="panel empty"><div>${icon(i)}<h2>${title}</h2><p>${copy}</p><button class="btn primary" data-action="${action}">${label}</button></div></div>`;}

 'reset-filter'(){activityTab='all';render();$('#activity-search')?.focus();},
 'reset-resource'(){render();$('#resource-search')?.focus();},
 entry(){openDialog('学生进入活动',`<div><h3>Unit 3 · 校园生活词汇闯关</h3><p class="muted small">七年级（2）班 · 发布版本 v1.2</p></div><p>正式入口卡将提供活动链接和二维码。本预览可直接打开学生页体验答题。</p><div class="callout">${icon('info')}<span>共享活动入口用于定位课堂。需要跨设备继续的学生，使用教师单独提供的个人进入码。</span></div>`,`<button class="btn" data-action="close">关闭</button><button class="btn primary" data-action="open-student">打开学生体验</button>`);},
 'open-student'(){closeDialog();navigate('student');},
 'save-draft'(){if(pageState==='offline'){toast('当前为断网状态示例，不能显示保存成功');return;}$('#draft-status').textContent='草稿保存状态样例';toast('演示：正式保存后会在标题旁显示保存状态');},
 revise(){const value=$('#teaching-goal').value.trim();if(!value){$('#teaching-goal').setAttribute('aria-invalid','true');toast('请先填写教学目标或修改要求');$('#teaching-goal').focus();return;}$('#teaching-goal').removeAttribute('aria-invalid');$('#draft-status').textContent='修改稿样例 · 待试做';$('#editor-hint').textContent='修改要求已在当前页面记录。正式生成后，需要重新试做确认。';toast('修改流程样例：本预览没有调用模型生成内容');},
 contract(){openDialog('活动将收集哪些内容',`<p>这些内容用于保存进度与诊断本次课堂，不代表网页中的所有点击都会被记录。</p><ul class="collected"><li>${icon('check')}题目答案与明确记录的尝试</li><li>${icon('check')}可恢复的闯关进度</li><li>${icon('check')}最终提交与保存回执</li></ul><p class="muted small">正式接入需教师试做，并确认服务端收到对应结果后才标记通过。</p>`);},
 trial(){openDialog('试做与收集检查',`<p>教师应先按学生流程作答，再核对收到的数据是否符合预期。</p><div class="callout orange">${icon('info')}<span>尚无真实试做回执。当前仅为设计预览，不能标记数据接入已验证。</span></div><p class="muted small">检查内容：题目答案、继续进度、完成提交。通过后才允许开展课堂。</p>`,`<button class="btn" data-action="close">返回草稿</button><button class="btn primary" data-action="open-student">体验答题流程</button>`);},
 export(){openDialog('导出课堂记录',`<div class="field"><label for="export-range">导出范围</label><select id="export-range"><option>最近一次有效完成提交</option><option>全部尝试历史</option></select></div><p class="muted">正式导出须核验当前课堂的数据权限。此预览不生成学生数据文件。</p>`,`<button class="btn" data-action="close">关闭</button>`);},
 evidence(){openDialog('易混词的作答依据',`<p class="muted">归纳覆盖 30 份有效提交，其中 12 人出现易混词错误。下方仅展示 3 条合成记录的样式。</p>${[['学生 01','将 laboratory 选择为“图书馆”'],['学生 02','将 library 选择为“实验室”'],['学生 05','将 laboratory 选择为“图书馆”']].map(([n,a])=>`<div class="evidence"><strong>${n} · 第 2 题</strong><br>${a}<br><span class="small muted">来源：v1.2 · 最近一次有效提交</span></div>`).join('')}<p class="small muted">正式页面按权限显示可追溯原始记录，不能把这 3 条演示数据当作完整分析证据。</p>`);},
 review(){if(reviewed){openDialog('教师复核记录','<p>林老师已在本次预览中标记复核。</p><p class="muted">此状态只在当前页面内演示，未写入真实课堂记录。</p>');return;}openDialog('确认已复核教学建议',`<p>复核表示你已检查归纳的覆盖范围与作答依据。</p><p class="muted">本操作不会自动发布新活动，也不会生成正式成绩。</p>`,`<button class="btn" data-action="close">再看看</button><button class="btn primary" data-action="confirm-review">标记已复核</button>`);},
 'confirm-review'(){reviewed=true;closeDialog();render();toast('复核状态已在预览中更新');},
 'resource-preview'(button){openDialog('校内活动预览',`<h3>${escapeHTML(button.dataset.name)}</h3><p>活动页面、题目和收集内容可供预览。资源库不授予源课堂学生记录的查看权。</p><p class="muted small">本轮先展示词汇闯关样板的完整学生视图。</p>`,`<button class="btn" data-action="close">关闭</button><button class="btn primary" data-action="open-student">打开样板预览</button>`);},
 'copy-resource'(button){copySource=resources.find(r=>r.name===button.dataset.name);openDialog('复制到我的活动',`<div class="field"><label for="copy-name">新活动名称</label><input id="copy-name" value="${escapeHTML(button.dataset.name)} · 副本" maxlength="80"><span class="inline-error" id="copy-error" hidden>请填写新活动名称。</span></div><div class="callout">${icon('copy')}<span>复制页面、题目和教学配置。不包含学生回答、名单或进入凭据。副本独立修改，原活动保持不变。</span></div>`,`<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="confirm-copy">复制活动</button>`);},
 'confirm-copy'(){const name=$('#copy-name').value.trim();if(!name){$('#copy-error').hidden=false;$('#copy-name').setAttribute('aria-invalid','true');$('#copy-name').focus();return;}if(!copySource)return;activities.unshift({name,type:copySource.type,subject:copySource.subject,grade:copySource.grade,status:'草稿',version:`来源 ${copySource.version} · 待试做`,className:'尚未开展',progress:'—',date:'刚刚',owner:'mine'});activityTab='all';closeDialog();navigate('activities');toast('已在本次预览中添加独立副本，刷新页面后重置');},
 publish(){openDialog('发布到校内资源库',`<div class="field"><label for="publish-activity">选择已验证活动版本</label><select id="publish-activity"><option>校园生活词汇闯关 · v1.2（样例）</option></select></div><p class="muted">发布的是教学资源，不包含学生记录。本校教师可以发现并复制该版本，不能据此修改你的源活动。</p>`,`<button class="btn" data-action="close">取消</button><button class="btn primary" data-action="publish-demo">查看发布反馈</button>`);},
 'publish-demo'(){closeDialog();toast('发布成功样式演示：实际资源库未发生变更');},
 invite(){openDialog('邀请教师加入学校',`<div class="field"><label for="invite-name">教师称呼</label><input id="invite-name" placeholder="例如：王老师"></div><p class="muted">正式邀请可生成入校链接，加入后由管理员分配任教范围。</p><div class="callout">${icon('info')}<span>本预览不会创建真实邀请或向任何人发送消息。</span></div>`,`<button class="btn" data-action="close">关闭</button>`);},
 member(button){const name=button.dataset.name;const admin=name==='许老师';openDialog(`${escapeHTML(name)}的权限`, `<p><strong>学校角色：</strong>${admin?'学校管理员':name==='周老师'?'教师 / 资源管理员':'教师'}</p><div class="callout">${icon('shield')}<span>${admin?'可以管理成员、班级与资源配置。没有默认的学生回答查看权。':'可以管理本人或明确授权的教学活动。不能查看其他教师的课堂记录。'}</span></div><h3>授权范围示例</h3><p>${admin?'成员与班级配置；资源管理；学校额度。':'分配的任教班级；本人或获授权课堂；校内资源发现与复制。'}</p><p class="muted small">整实例备份恢复需单独的部署运维授权。</p>`);},
 'previous-question'(){if(questionIndex>0){questionIndex--;render();}},
 'next-question'(){if(answers[questionIndex]===undefined||pageState==='offline')return;if(questionIndex<questions.length-1){questionIndex++;}else{submitted=true;}render();},
 'restart-student'(){answers={};questionIndex=0;submitted=false;render();},
 retry(){pageState='normal';render();toast('已恢复正常状态样例');},
 back(){pageState='normal';navigate('activities');},
 'sample-dialog'(){openDialog('弹窗与焦点样式','<p>弹层用于需要聚焦的短操作。按 Escape 可关闭，关闭后焦点回到触发按钮。</p>','<button class="btn primary" data-action="close">知道了</button>');}
};
document.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button||button.disabled)return;
 if(button.dataset.page){navigate(button.dataset.page);return;}
 if(button.dataset.action){actions[button.dataset.action]?.(button);return;}
 if(button.dataset.tab){activityTab=button.dataset.tab;document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===activityTab));updateActivities();return;}
 if(button.dataset.report){reportTab=button.dataset.report;render();return;}
 if(button.dataset.answer!==undefined){answers[questionIndex]=Number(button.dataset.answer);render();$(`[data-answer="${button.dataset.answer}"]`)?.focus();return;}
 if(button.dataset.previewChoice!==undefined){document.querySelectorAll('[data-preview-choice]').forEach(b=>{const selected=b===button;b.classList.toggle('selected',selected);b.setAttribute('aria-pressed',String(selected));});$('#editor-hint').textContent='选中效果预览。点击“试做并检查”查看完整流程要求。';}
});
document.addEventListener('input',event=>{if(event.target.id==='activity-search')updateActivities();if(event.target.id==='resource-search')updateResources();});
document.addEventListener('change',event=>{
 const target=event.target;
 if(target.id==='page-picker')navigate(target.value);
 if(target.id==='state-picker'){pageState=target.value;render();}
 if(['activity-type','activity-status'].includes(target.id))updateActivities();
 if(target.id==='resource-subject')updateResources();
 if(target.id==='import-file')$('#import-status').textContent=target.files[0]?`已选择 ${target.files[0].name}（只展示文件名，未读取）`:'尚未选择文件。';
});
window.addEventListener('hashchange',()=>{const next=location.hash.slice(1);page=pages.includes(next)?next:'activities';pageState='normal';closeDialog();render();window.scrollTo(0,0);$('#main').focus({preventScroll:true});});
page=pages.includes(location.hash.slice(1))?location.hash.slice(1):'activities';render();
</script>
</body>
</html>
